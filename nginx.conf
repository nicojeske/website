server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Deny anything that looks like a leftover from the old compromised
    # WordPress install. These paths were used by webshells and an SEO
    # doorway-page generator; 410 (rather than 404) tells crawlers the
    # content is gone for good so they drop it from their index quickly.
    location ~ ^/(dnews|fnews|rnews|snews|tnews|ambi)/ { return 410; }
    location ~ ^/(moban|shengcheng)\.php$ { return 410; }
    location = /wp-links-opml.php { return 410; }
    location ~ ^/(keywords|wenzhang|neirong)\.txt$ { return 410; }
    location = /googleac0bc1ded1d6eb9d.html { return 410; }
    location = /BingSiteAuth.xml { return 410; }

    # There is no PHP interpreter on this site at all, so any request for a
    # .php file is either an old bookmark or an attacker probing for the
    # webshells that used to live here. Kill it explicitly.
    location ~ \.php$ { return 410; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
